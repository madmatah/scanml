org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# Builds run in a throwaway container: compile Kotlin inside the Gradle process
# instead of spawning a separate Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
# SDK packages are installed (and verified) by scripts/build-apk.sh only: never let AGP
# download missing ones on its own.
android.builder.sdkDownload=false
