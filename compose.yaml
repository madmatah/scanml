# Which stack this is comes from .env: COMPOSE_PROJECT_NAME names the containers
# (<project>-api-1...) and IMAGE_PREFIX the images (<prefix>-api, <prefix>-ocr).
# Production's .env (scanmylib for both) is written by scripts/setup.sh in
# production's checkout; a worktree's, for the development stack, by
# scripts/dev-env.sh.
# A copy of .env.example has neither, and every path variable is required (":?"):
# such a .env makes docker compose stop instead of guessing. In a worktree, run
# docker compose through scripts/dev.sh, which first checks that the stack shares
# nothing with production; in production's checkout, through scripts/prod.sh,
# which reads production's .env only (see CLAUDE.md).
name: ${COMPOSE_PROJECT_NAME:?no COMPOSE_PROJECT_NAME in .env. In a worktree run scripts/dev-env.sh, then scripts/dev.sh}

x-ocr-build: &ocr-build
  context: ./ocr
  args:
    UID: ${SCANMYLIB_UID:-1000}
    GID: ${SCANMYLIB_GID:-1000}

x-ocr-env: &ocr-env
  HOME: /tmp/home
  XDG_CACHE_HOME: /var/cache/ocr
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"
  # /opt/sandbox is read-only at runtime: caches go to /var/cache/ocr (kept
  # across restarts, it holds compiled kernels) or to the /tmp tmpfs.
  PADDLE_PDX_CACHE_HOME: /var/cache/ocr/paddlex
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
  VLLM_CACHE_ROOT: /var/cache/ocr/vllm
  TRITON_CACHE_DIR: /var/cache/ocr/triton
  TORCHINDUCTOR_CACHE_DIR: /var/cache/ocr/torchinductor
  CUDA_CACHE_PATH: /var/cache/ocr/nv
  # Engine settings (docs/OCR_SANDBOX.md), overridable from .env.
  OCR_ENGINE: ${OCR_ENGINE:-paddleocr-vl}
  OCR_BACKEND: ${OCR_BACKEND:-vllm}
  OCR_IDLE_UNLOAD_S: ${OCR_IDLE_UNLOAD_S:-300}
  OCR_VLLM_GPU_MEM: ${OCR_VLLM_GPU_MEM:-0.15}
  OCR_VLLM_PORT: ${OCR_VLLM_PORT:-8118}
  OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-16}

services:
  # Our own code: receives scans from the phone, organizes the library, serves
  # the web UI, and drives the sandbox through the Unix socket.
  api:
    build:
      context: ./server
      target: runtime
      # The repository root, for its VERSION file only (the version the api reports).
      additional_contexts:
        project: .
      args:
        UID: ${SCANMYLIB_UID:-1000}
        GID: ${SCANMYLIB_GID:-1000}
    image: ${IMAGE_PREFIX:-${COMPOSE_PROJECT_NAME}}-api:latest
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${SCANMYLIB_UID:-1000}:${SCANMYLIB_GID:-1000}"
    init: true
    pids_limit: 512
    # Bounds what a hostile sandbox answer (capped at 128 MiB) or a huge photo can cost.
    mem_limit: 3g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - target: 8765
        published: "${API_PORT:-8765}"
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - type: bind
        source: ${LIBRARY_DIR:?no LIBRARY_DIR in .env}
        target: /library
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/state
        target: /state
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/run
        target: /run/scanmylib
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/app
        target: /app-dist
        read_only: true
        bind:
          create_host_path: true
    environment:
      SCANMYLIB_LIBRARY_DIR: /library
      SCANMYLIB_LIBRARY_HOST_PATH: ${LIBRARY_DIR:?no LIBRARY_DIR in .env}
      SCANMYLIB_STATE_DIR: /state
      SCANMYLIB_OCR_SOCKET: /run/scanmylib/ocr.sock
      SCANMYLIB_PUBLIC_URL: ${PUBLIC_URL}
      SCANMYLIB_APK_PATH: /app-dist/scanmylib.apk
      # Local time in document.md, INDEX.md and trash folder names.
      TZ: ${SCANMYLIB_TZ:-UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  # The sandbox: runs PaddleOCR-VL (Paddle + vLLM) with no network at all.
  # It only sees the read-only sandbox dir (venvs + models), the socket dir it
  # shares with `api`, a cache dir and a tmpfs. Nothing from $HOME.
  ocr:
    build: *ocr-build
    image: ${IMAGE_PREFIX:-${COMPOSE_PROJECT_NAME}}-ocr:latest
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${SCANMYLIB_UID:-1000}:${SCANMYLIB_GID:-1000}"
    init: true
    devices: ["nvidia.com/gpu=all"]
    shm_size: 2gb
    pids_limit: 4096
    # Host RAM the sandbox may take (its tmpfs and /dev/shm included); measured
    # peak: 6.1 GB with vLLM (engine start + pages), 2.2 GB with OCR_BACKEND=native.
    mem_limit: 16g
    # Everything vLLM and Paddle print ends up in the container log, on the
    # Docker root partition: rotated, so that it cannot fill that disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    tmpfs:
      - /tmp:size=8g,mode=1777
    volumes:
      - type: bind
        source: ${SANDBOX_DIR:?no SANDBOX_DIR in .env}
        target: /opt/sandbox
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/run
        target: /run/scanmylib
        bind:
          create_host_path: true
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/ocr-cache
        target: /var/cache/ocr
        bind:
          create_host_path: true
    environment:
      <<: *ocr-env
    healthcheck:
      test: ["CMD", "python3", "-m", "scanmylib_ocr.client"]
      interval: 30s
      timeout: 10s
      start_period: 10s
    # Leaves time to stop vLLM cleanly when the container stops.
    stop_grace_period: 30s
    restart: unless-stopped

  # Development stand-in for `ocr` (profile "fake-ocr", started by scripts/dev.sh
  # instead of `ocr`, never next to it: they serve the same socket). The api
  # image answers the sandbox protocol with canned pages
  # (server/scanmylib/devtools/fake_ocr.py): no model, no GPU, and the same
  # isolation as the sandbox. It only sees the socket dir. It refuses to run in
  # the production project and to replace a socket that a sandbox serves.
  ocr-fake:
    profiles: ["fake-ocr"]
    image: ${IMAGE_PREFIX:-${COMPOSE_PROJECT_NAME}}-api:latest
    # Built by the `api` service: never pulled from a registry.
    pull_policy: never
    command: ["python", "-m", "scanmylib.devtools.fake_ocr", "--delay", "0.5"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${SCANMYLIB_UID:-1000}:${SCANMYLIB_GID:-1000}"
    init: true
    pids_limit: 128
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${DATA_DIR:?no DATA_DIR in .env}/run
        target: /run/scanmylib
        bind:
          create_host_path: true
    environment:
      SCANMYLIB_PROJECT: ${COMPOSE_PROJECT_NAME}
    healthcheck:
      test: ["CMD", "python", "-m", "scanmylib.devtools.fake_ocr", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  # One-shot installer (profile "setup"): the only OCR container with network.
  # It sees nothing but the sandbox dir, where it installs packages and models,
  # read-write: SANDBOX_SETUP_DIR, which only production's .env sets (written by
  # scripts/setup.sh), never a worktree's, whose stack mounts production's
  # SANDBOX_DIR read-only. Without it, the bind source below does not exist and
  # the container cannot start.
  ocr-setup:
    profiles: ["setup"]
    build: *ocr-build
    image: ${IMAGE_PREFIX:-${COMPOSE_PROJECT_NAME}}-ocr:latest
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${SCANMYLIB_UID:-1000}:${SCANMYLIB_GID:-1000}"
    init: true
    volumes:
      - type: bind
        source: ${SANDBOX_SETUP_DIR:-/nonexistent/SANDBOX_SETUP_DIR-is-set-by-scripts-setup.sh-in-production-only}
        target: /opt/sandbox
        bind:
          create_host_path: false
    environment:
      HOME: /tmp/home
    tmpfs:
      - /tmp:size=8g,mode=1777
    command: ["bash", "/app/setup/install.sh"]
