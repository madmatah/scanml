[mypy]
python_version = 3.12
strict = True

# The OCR engines run in the sandbox's own environments, which hold no type information.
[mypy-paddleocr.*,paddle.*,paddlex.*,vllm.*]
ignore_missing_imports = True

# numpy and OpenCV come with the engines into the sandbox's environments (the worker and the photo variants of the
# benchmark), so the lint image, which must not install the engines, has no type information for them.
[mypy-numpy.*,cv2.*]
ignore_missing_imports = True

# qrcode ships no type information, and its stubs (types-qrcode) are not among the api's dependencies.
[mypy-qrcode.*]
ignore_missing_imports = True
